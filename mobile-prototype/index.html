<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Word Snake · Mobile Prototype</title><style>*{box-sizing:border-box}body{margin:0;background:#10192e;color:white;font:14px "Courier New",monospace}header{padding:8px;text-align:center;background:#203a67}header strong{color:#f2d64b}iframe{display:block;width:100%;height:calc(100dvh - 48px);border:0}button{font:700 13px "Courier New";padding:7px;background:#f2d64b;border:2px solid #101a43}</style></head><body><header><strong>WORD SNAKE · MOBILE TEST</strong> <button id="start">START / RESTART</button></header><iframe id="game" src="./snake-game.html" title="Playable Word Snake mobile prototype" allow="fullscreen"></iframe><script>const frame=document.getElementById("game");const pairs=[["cat","gato"],["dog","perro"],["bird","pájaro"],["fish","pez"],["horse","caballo"],["cow","vaca"],["pig","cerdo"],["duck","pato"],["mouse","ratón"],["rabbit","conejo"],["sheep","oveja"],["bear","oso"]];function start(){frame.contentWindow.postMessage({type:"BT_SNAKE_START",vocabulary:{pairs,language:"es-ES"}},location.origin)}window.addEventListener("message",e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;if(e.data?.type==="BT_SNAKE_READY")start();if(e.data?.type==="BT_SNAKE_MENU")start();});document.getElementById("start").onclick=start;</script></body></html>
