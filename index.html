<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Snake — Boring Teacher</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#10192e;color:#f8f8ff;font-family:"Courier New",monospace}
#snakeFrame{display:none;width:100%;height:100dvh;min-height:480px;border:0;background:#16264e}
#snakeFrame.playing{display:block}
#app{min-height:100dvh;display:grid;place-items:center;padding:20px}
#app[hidden]{display:none!important}
.card{width:min(560px,100%);background:#233958;border:4px solid #7bbaf3;padding:24px;box-shadow:6px 6px #071328}
h1{margin:0 0 14px;color:#f2d64b;font-size:clamp(24px,6vw,38px)}
p{line-height:1.6;overflow-wrap:anywhere}
a{display:inline-block;color:#10192e;background:#f2d64b;border:3px solid #10192e;padding:12px 18px;font-weight:900;text-decoration:none;margin-top:10px}
a:focus-visible{outline:3px solid white;outline-offset:3px}
</style>
</head>
<body>
<main id="app" role="status" aria-live="polite">
  <section class="card">
    <h1>WORD SNAKE</h1>
    <p id="message">Loading vocabulary…</p>
    <a id="home" href="https://boringteacher.com/">RETURN TO WORD GAMES</a>
  </section>
</main>
<iframe id="snakeFrame" title="Word Snake gameplay" src="./snake-game.html?release=universal-launcher-mobile-20261030"></iframe>
<script type="module">
import {createSharingClient,readStudentSetId} from "./core/sharing.js?release=multilingual-20261023b";
import {createVoiceService} from "./core/voice.js?release=multilingual-20261023b";
import {isSupportedLocale} from "./core/languages.js?release=multilingual-20261023b";

const HOME="https://boringteacher.com/";
const root=document.getElementById("app");
const message=document.getElementById("message");
const frame=document.getElementById("snakeFrame");
const sharing=createSharingClient({apiBaseUrl:"https://boringteacher-vocabulary-api.mcproductionsdk.workers.dev"});
const voice=createVoiceService();
const params=new URLSearchParams(location.search);
const id=readStudentSetId(location.href);
let ready=false,started=false,pending=null,startTimer=null,finished=false;

function error(text){
  if(finished)return;
  clearTimeout(startTimer);
  pending=null;
  document.getElementById("home").hidden=false;
  message.textContent=text;
  root.hidden=false;
  frame.classList.remove("playing");
  voice.cancel();
}
function send(type,extra={}){
  frame.contentWindow?.postMessage({type,...extra},location.origin);
}
function deliver(){
  if(ready&&pending){
    send("BT_SNAKE_START",{vocabulary:pending});
    pending=null;
  }
}
function launch(set){
  if(finished)return;
  if(!set||!Array.isArray(set.pairs)||set.pairs.length<5||
     !isSupportedLocale(set.language)||!isSupportedLocale(set.promptLanguage)||
     set.language===set.promptLanguage){
    error("This vocabulary set is invalid or uses unsupported languages. Return to Word Games.");
    return;
  }
  // The homepage and the engine both consume [prompt,target], in that order.
  pending=set;
  root.hidden=true;
  frame.classList.add("playing");
  started=false;
  clearTimeout(startTimer);
  startTimer=setTimeout(()=>{
    if(!started)error("Word Snake did not start. Return to Word Games and try again.");
  },12000);
  deliver();
  send("BT_SNAKE_PING");
}
function returnHome(){
  finished=true;
  clearTimeout(startTimer);
  voice.cancel();
  // Returning through browser history preserves whether the teacher was editing
  // on the homepage or the student was using its #set= launcher.
  try{
    const ref=new URL(document.referrer);
    if(ref.origin===new URL(HOME).origin&&
       (ref.pathname==="/"||ref.pathname==="/dev/word-games/")&&
       history.length>1){
      history.back();
      return;
    }
  }catch{}
  const dest=new URL(HOME);
  if(id)dest.hash="set="+encodeURIComponent(id);
  location.assign(dest.toString());
}
window.addEventListener("message",event=>{
  if(event.origin!==location.origin||event.source!==frame.contentWindow)return;
  const data=event.data||{};
  if(data.type==="BT_SNAKE_READY"){ready=true;deliver();}
  if(data.type==="BT_SNAKE_STARTED"){started=true;clearTimeout(startTimer);frame.focus();}
  if(data.type==="BT_SNAKE_START_FAILED")error("Word Snake could not open this vocabulary set. Return to Word Games.");
  if(data.type==="BT_SNAKE_SPEAK"&&typeof data.text==="string"&&data.text.length<=250&&
      isSupportedLocale(data.language))void voice.speak(data.text,data.language);
  if(data.type==="BT_SNAKE_CANCEL_SPEECH")voice.cancel();
  if(data.type==="BT_SNAKE_MENU")returnHome();
});
frame.addEventListener("load",()=>{ready=false;send("BT_SNAKE_PING");});
window.addEventListener("pagehide",()=>{clearTimeout(startTimer);voice.cancel();});
if(!id){
  error(location.hash?"Invalid or missing vocabulary set ID. Open the link provided by your teacher.":"Select your vocabulary on the Boring Teacher homepage, then choose Word Snake.");
}else{
  message.textContent="Loading shared vocabulary…";
  sharing.loadSet(id).then(launch).catch(err=>
    error("Unable to load the shared vocabulary: "+(err?.message||"Unknown error")+". Return to Word Games.")
  );
}
send("BT_SNAKE_PING");
</script>
</body>
</html>
