name: Word Snake — production safety checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check JavaScript core syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in core/*.js; do node --check "$f"; done
          node --check tests/release-e2e.mjs

      - name: Run production release invariants
        run: node --test tests/release.test.mjs

      - name: Install Playwright browser client
        run: npm install --no-save --no-package-lock playwright-core@1.56.1

      - name: Check the actual production entry in Chrome
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v google-chrome-stable || true)"
          if [ -z "$CHROME_BIN" ]; then echo "Chrome unavailable; test must not be skipped" >&2; exit 1; fi
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/word-snake-release-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/index.html > /dev/null; then break; fi
            sleep 1
          done
          node tests/release-e2e.mjs

      - name: Preserve mobile browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: word-snake-release-mobile
          path: tests/artifacts/
          if-no-files-found: ignore
